unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Xabarlar ekranda 3 soniya ko'rinib turishi uchun
set -g display-time 3000

# Eski keraksiz split tugmalarini bekor qilish
unbind %
unbind '"'

# =========================
# 🧭 Session Management (Rasmiy va Barqaror)
# =========================
# 1. Barcha sessiyalar daraxti (Rasmiy Tmux Session Tree):
# Enter — ulanish / x keyin y — sessiyani o'chirish
bind s choose-tree -Zs

# 2. Barcha oynalar daraxti:
bind w choose-tree -Zw

# 3. Sessiyani xotiraga saqlash (Resurrect):
# Prefix + Ctrl+s
bind C-s run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh' \; display-message " 💾 [Tmux] Sessiyalar muvaffaqiyatli saqlandi! "

# 4. Sessiyani xotiradan qayta tiklash:
# Prefix + Ctrl+r
bind C-r run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh' \; display-message " 🔄 [Tmux] Sessiyalar xotiradan qayta tiklandi! "

# 5. Sessiya nomini o'zgartirish (Rename):
# Prefix + r
bind r command-prompt -I "#S" "rename-session -- '%%'"

# 6. Yangi bo'sh sessiya ochish:
# Prefix + N
bind N command-prompt -p "New session name:" "new-session -s '%%'"

# 7. Detach (sessiondan chiqish):
# Prefix + d
bind d detach-client

# =========================
# 🪟 Splitlar va Oynalar
# =========================
# Yangi oyna ochish (Prefix + c)
bind c new-window -c "#{pane_current_path}"

# Vertikal split: Yonma-yon o'ngga ochish (Prefix + v)
bind v split-window -h -c "#{pane_current_path}"

# Gorizontal split: Tepa-pastga ochish (Prefix + h)
bind h split-window -v -c "#{pane_current_path}"

# Splitni yopish (Prefix + x)
bind x kill-pane

# Splitni butun ekranga kattalashtirish / qaytarish (Prefix + z)
bind z resize-pane -Z

# Shift + Strelkalar orqali split o'lchamini o'zgartirish
bind -n S-Left resize-pane -L 4
bind -n S-Right resize-pane -R 4
bind -n S-Up resize-pane -U 4
bind -n S-Down resize-pane -D 4

# Shift + Alt + h/l orqali oynalarni (window/tab) almashtirish
bind -n M-H previous-window
bind -n M-L next-window

# =========================
# Seamless Neovim <-> Tmux Navigation
# (Ctrl+h, Ctrl+j, Ctrl+k, Ctrl+l)
# =========================
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# --- stop tmux from drawing window attention ---
set -g bell-action none
set -g activity-action none
set -g silence-action none
setw -g monitor-bell off
setw -g monitor-activity off
setw -g monitor-silence 0
set -g visual-bell off
set -g visual-activity off
set -g visual-silence off

# --- allow Ghostty notifications to pass through tmux ---
set -g allow-passthrough on
set -g focus-events on

# =========================
# 💾 Plugins (TPM)
# =========================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sessionist'

set -g @continuum-restore 'off'
set -g @continuum-save-interval '10'
set -g @resurrect-strategy-nvim 'session'

# Initialize TPM
run '~/.config/tmux/plugins/tpm/tpm'

# =========================
# 🎨 Vague Status Bar & Borders
# =========================
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#141415,fg=#cdcdcd"

set -g status-left-length 60
set -g status-right-length 120

# Left: Prefix indicator + Session name + Active Sessions count
set -g status-left "#{?client_prefix,#[fg=#ffffff,bg=#e06c75,bold] ⌨️ CMD #[default] ,}#[fg=#141415,bg=#6e94b2,bold] #S #[fg=#7e98e8,bg=#252530] #(tmux ls 2>/dev/null | wc -l) sess #[bg=#141415] "

# Middle: Windows list
set -g window-status-separator " "
set -g window-status-format "#[fg=#606079,bg=#141415] #I:#W "
set -g window-status-current-format "#[fg=#cdcdcd,bg=#252530,bold] #I:#W "

# Right: Path, CPU, RAM, Battery, Clock in muted Vague colors
set -g status-right "#[fg=#606079]#{pane_current_path} #[fg=#252530]| #[fg=#6e94b2]CPU:#(cut -d' ' -f1 /proc/loadavg) #[fg=#606079]RAM:#(free -m | awk '/Mem/{printf \"%.0f%%\", $3/$2*100}') #[fg=#7e98e8]BAT:#(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo N/A)%% #[fg=#252530]| #[fg=#cdcdcd]%H:%M "

# Subtle pane borders matching Vague line color
set -g pane-border-style "fg=#252530"
set -g pane-active-border-style "fg=#6e94b2"

# Enable OSC 52 clipboard forwarding
set -as terminal-features ",*:clipboard"
