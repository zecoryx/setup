# Prefix key
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Message display duration (ms)
set -g display-time 3000

# Remove default split bindings
unbind %
unbind '"'

# Session management
bind s choose-tree -Zs
bind w choose-tree -Zw
bind C-s run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh' \; display-message "Tmux sessions saved"
bind C-r run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh' \; display-message "Tmux sessions restored"
bind r command-prompt -I "#S" "rename-session -- '%%'"
bind N command-prompt -p "New session name:" "new-session -s '%%'"
bind d detach-client

# Window and pane management
bind c new-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
bind x kill-pane
bind z resize-pane -Z

# Pane resizing with Shift + Arrow keys
bind -n S-Left resize-pane -L 4
bind -n S-Right resize-pane -R 4
bind -n S-Up resize-pane -U 4
bind -n S-Down resize-pane -D 4

# Window navigation with Alt + Shift + h/l
bind -n M-H previous-window
bind -n M-L next-window

# Seamless Neovim and Tmux navigation
is_vim="ps -o state= -o comm= -t '#{pane_tty}'     | grep -iqE '^[^TXZ ]+ +(\S+\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "" 'send-keys C-l'  'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Terminal bells and activity monitoring
set -g bell-action none
set -g activity-action none
set -g silence-action none
setw -g monitor-bell off
setw -g monitor-activity off
setw -g monitor-silence 0
set -g visual-bell off
set -g visual-activity off
set -g visual-silence off

# Terminal notifications and events
set -g allow-passthrough on
set -g focus-events on

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sessionist'

set -g @continuum-restore 'off'
set -g @continuum-save-interval '10'
set -g @resurrect-strategy-nvim 'session'

# Initialize TPM
run '~/.config/tmux/plugins/tpm/tpm'

# Status bar and appearance
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#141415,fg=#cdcdcd"

set -g status-left-length 60
set -g status-right-length 120

# Left: Prefix indicator, session name, session count
set -g status-left "#{?client_prefix,#[fg=#ffffff,bg=#e06c75,bold] PREFIX #[default] ,}#[fg=#141415,bg=#6e94b2,bold] #S #[fg=#7e98e8,bg=#252530] #(tmux ls 2>/dev/null | wc -l) sess #[bg=#141415] "

# Window list
set -g window-status-separator " "
set -g window-status-format "#[fg=#606079,bg=#141415] #I:#W "
set -g window-status-current-format "#[fg=#cdcdcd,bg=#252530,bold] #I:#W "

# Right: Current path, load average, memory, battery, time
set -g status-right "#[fg=#606079]#{pane_current_path} #[fg=#252530]| #[fg=#6e94b2]CPU:#(cut -d' ' -f1 /proc/loadavg) #[fg=#606079]RAM:#(free -m | awk '/Mem/{printf "%.0f%%", /*100}') #[fg=#7e98e8]BAT:#(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo N/A)%% #[fg=#252530]| #[fg=#cdcdcd]%H:%M "

# Pane borders
set -g pane-border-style "fg=#252530"
set -g pane-active-border-style "fg=#6e94b2"

# Clipboard forwarding
set -as terminal-features ",*:clipboard"
